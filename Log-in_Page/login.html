<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="login.css">
  <script src="login.js" defer></script>
</head>
<body>
  <!--Header section with navigation bar-->
  <header>
    <div class="logo">FarmLife</div>
    <nav>
      <ul>
        <li><a href="homepage.html" target="_blank">Home</a></li>
        <li><a href="dashboard.html" target="_blank">Dashboard</a></li>
        <li><a href="animals.html" target="_blank">Animals</a></li>

  <!--Main content section with login form-->
  <main class="auth-container">
    <h2>Login to FarmLife</h2>
    <p>Access your dashboard and manage your herd securely</p>
    <form action="" id="loginForm">
      <input type="email" id="email" placeholder="Email" required>
      <input type="password" id="password" placeholder="Password" required>

      <button type="submit">Login</button>
    </form>

    <!--Links for sign up and forgot password-->
    <p>Don't have an account?<a href="signup.html">Sign up</a></p>
    <p>Forgot your password?<a href="forgot-password.html">Forgot Password</a></p>
  </main>

  </footer>
