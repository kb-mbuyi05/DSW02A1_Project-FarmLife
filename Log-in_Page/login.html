<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FarmLife - Login</title>
  <link rel="stylesheet" href="login.css">
  <link rel="stylesheet" href="../shared.css">
  <script src="login.js" defer></script>
</head>
<body>
  <!--Header section with navigation bar-->
  <header>
    <div class="logo">FarmLife</div>
  </header>

  <!--Main content section with login form-->
  <main class="auth-container">
    <div class="decorative-shapes">
      <span class="shape large"></span>
      <span class="shape medium"></span>
      <span class="shape small"></span>
    </div>
    <h1>Welcome to FarmLife</h1>
    <p class="hero-heading">Smart Farming Starts Here</p>
    <h2>Login to FarmLife</h2>
    <form action="" id="loginForm">
      <fieldset class="role-selection">
        <legend>Select your role</legend>
        <div class="role-grid">
          <label class="role-card" for="role-admin">
            <input type="radio" id="role-admin" name="role" value="admin">
            <span class="role-badge">Admin</span>
            <strong>Admin</strong>
          </label>
          <label class="role-card" for="role-farmer">
            <input type="radio" id="role-farmer" name="role" value="farmer">
            <span class="role-badge">Farmer</span>
            <strong>Farmer</strong>
          </label>
          <label class="role-card" for="role-community">
            <input type="radio" id="role-community" name="role" value="community">
            <span class="role-badge">Community</span>
            <strong>Forum</strong>
          </label>
        </div>
      </fieldset>

      <label for="email">Email</label>
      <input type="email" id="email" required>

      <label for="password">Password</label>
      <input type="password" id="password" required>
      <label class="show-password"><input type="checkbox" id="showPassword"> Show Password</label>

      <button type="submit">Login</button>
      <div id="loginMessage" class="login-message" aria-live="polite"></div>
    </form>

    <!--Links for sign up and forgot password-->
    <p>Don't have an account?<a href="../Sign-up_Page/signup.html">Sign up</a></p>
    <p>Forgot your password?<a href="../Forgot-Password_Page/forgot-password.html">Forgot Password</a></p>
  </main>

  <footer>
    <p>&copy; 2026 FarmLife. All rights reserved.</p>
  </footer>

</body>
</html>
