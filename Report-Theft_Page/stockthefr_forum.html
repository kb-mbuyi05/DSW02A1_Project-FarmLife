<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stock Theft Forum</title>
    <script src="stockthefr_forum.js" defer></script>
    <style>
      body { font-family: Arial, sans-serif; background: #f8fafc; margin: 0; }
      .forum-container { max-width: 700px; margin: 40px auto; background: #fff; border-radius: 10px; box-shadow: 0 2px 12px rgba(44,62,80,0.07); padding: 32px; }
      .forum-alert { background: #fff3cd; border-left: 6px solid #f39c12; padding: 18px 22px; border-radius: 8px; margin-bottom: 24px; }
      .forum-alert h2 { margin-top: 0; color: #c0392b; }
      button { background: #2c3e50; color: #fff; border: none; border-radius: 5px; padding: 10px 18px; cursor: pointer; margin-top: 10px; }
      button:hover { background: #f39c12; color: #2c3e50; }
    </style>
</head>
<body>
    <div class="forum-container">
      <h1>Stock Theft Forum</h1>
      <div id="forumNotification"></div>
      <p>Welcome to the Stock Theft Forum. Here, you will receive real-time notifications about reported thefts and can track livestock using animal tags.</p>
      <p>Click "Track Animal Location" to view the animal's latest GPS data from the Animal Profiles page.</p>
    </div>
</body>
</html>
