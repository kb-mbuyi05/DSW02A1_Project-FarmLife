<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stock Theft Forum</title>
    <script src="stockthefr_forum.js" defer></script>
    <link rel="stylesheet" href="../shared.css">
    <style>
      .forum-topbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        max-width: 1120px;
        margin: 24px auto 0;
        padding: 0 20px;
      }
      .forum-topbar nav {
        display: flex;
        gap: 16px;
        flex-wrap: wrap;
      }
      .forum-topbar nav a {
        color: #0f172a;
        text-decoration: none;
        font-weight: 600;
        padding: 10px 12px;
        border-radius: 12px;
        transition: background 0.2s ease;
      }
      .forum-topbar nav a:hover {
        background: rgba(37, 99, 235, 0.1);
      }
      .forum-container { max-width: 700px; margin: 20px auto 40px; padding: 32px; }
      .forum-alert { background: #fff3cd; border-left: 6px solid #f39c12; padding: 18px 22px; border-radius: 8px; margin-bottom: 24px; }
      .forum-alert h2 { margin-top: 0; color: #c0392b; }
      .forum-contact-card { background: #eff6ff; border: 1px solid #bfdbfe; border-radius: 16px; padding: 22px; margin-bottom: 24px; }
      .forum-contact-card ul { list-style: none; padding: 0; margin: 0; }
      .forum-contact-card li { margin-bottom: 10px; color: #0f172a; }
      .forum-contact-card strong { color: #0f172a; }
      .logout-btn {
        border: none;
        background: #2563eb;
        color: white;
        padding: 12px 20px;
        border-radius: 999px;
        cursor: pointer;
        font-weight: 700;
      }
      .logout-btn:hover {
        background: #1d4ed8;
      }
    </style>
</head>
<body>
    <header class="forum-topbar">
      <div class="logo">FarmLife</div>
      <nav>
        <a href="../Insights-Analytics_Page/insights-analytics.html">Insights & Analytics</a>
      </nav>
      <button class="logout-btn" type="button" onclick="logoutForum()">Logout</button>
    </header>
    <div class="forum-container">
      <h1>Stock Theft Forum</h1>
      <div id="forumNotification"></div>
      <div id="forumContact" class="forum-contact"></div>
      <p>Welcome to the Stock Theft Forum. Here, you will receive real-time notifications about reported thefts and can track livestock using animal tags.</p>
      <p>Click "Track Animal Location" to view the animal's latest GPS data from the Animal Profiles page.</p>
    </div>
    <script>
      function logoutForum() {
        localStorage.removeItem('farmLifeUserRole');
        window.location.href = '../Log-in_Page/login.html';
      }
    </script>
</body>
</html>
