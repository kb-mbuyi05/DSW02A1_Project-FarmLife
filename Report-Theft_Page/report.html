<!DOCTYPE html>

  <script src="report.js"></script>
</head>
<body>

  <!--Header section with navigation bar-->
  <header>
    <div class="logo">FarmLife</div>
    <nav>
      <ul>
        <li><a href="homepage.html" target="_blank">Home</a></li>
        <li><a href="dashboard.html" target="_blank">Dashboard</a></li>
        <li><a href="animals.html" target="_blank">Animals</a></li>

    </nav>

  <!--This form takes input for reporting theft incidents-->
  <main class="report-page">
    <h1>Report Theft Incident</h1>
    <p>Please provide details of the incident so the community can assist in recovery.</p>

    <form id="reportForm">
      <label for="farmerName">Farmer Name</label>
      <input type="text" id="farmerName" placeholder="Your full name" required>

      <label for="animalType">Animal Type</label>
      <input type="text" id="animalType" placeholder="e.g. Brahman cattle, Merino sheep" required>

      <label for="quantity">Number of Animals</label>
      <input type="number" id="quantity" placeholder="e.g. 12" required>

      <label for="location">Location</label>
      <input type="text" id="location" placeholder="District / Province" required>

      <label for="description">Incident Description</label>
      <textarea id="description" placeholder="Describe what happened (fence cut, vehicle sighted, etc.)" required></textarea>

      <label for="status">Status</label>
      <select id="status" required>
        <option value="pending">Pending</option>
        <option value="verified">Verified</option>
        <option value="resolved">Resolved</option>
      </select>

      <button type="submit">Submit Report</button>
    </form>
  </main>

  <footer>
    <p>© 2026 FarmLife. All rights reserved.</p>
  </footer>
</body>
