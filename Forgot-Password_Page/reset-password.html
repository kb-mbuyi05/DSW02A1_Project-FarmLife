<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FarmLife - Reset Password</title>
  <link rel="stylesheet" href="forgot-password.css">
  <link rel="stylesheet" href="../shared.css">
  <style>
    .hidden { display: none; }
  </style>
  <script src="reset-password.js" defer></script>
</head>
<body>
  <form id="forgotForm">
  <label for="email">Email Address</label>
  <input type="email" id="email" required>
  <button type="submit">Send Reset Link</button>
</form>
<div id="forgotMessage"></div>
<p id="fallbackLink" style="display:none;"></p>

  <header>
    <div class="logo">FarmLife</div>
    <nav>
      <ul>
        <li><a href="../Homepage/homepage.html">Home</a></li>
        <li><a href="../Dashboard_Page/dashboard.html">Dashboard</a></li>
        <li><a href="../AnimalProfiles_Page/animal-profiles.html">Animals</a></li>
        <li><a href="../Community-Reports_Page/community.html">Community</a></li>
        <li><a href="../notifications.HTML">Alerts</a></li>
        <li><a href="../Inventory-Sales_Page/inventory-sales.html">Inventory & Sales</a></li>
        <li><a href="../Insights-Analytics_Page/insights-analytics.html">Insights & Analytics</a></li>
        <li><a href="../about.html">About</a></li>
        <li><a href="../Services.html">Services</a></li>
        <li><a href="../Settings.html">Settings</a></li>
      </ul>
    </nav>
  </header>

  <main class="auth-container">
    <h2>Reset Password</h2>
    <p id="resetIntro">Loading reset link...</p>
    <form action="" id="resetForm" class="hidden">
      <label for="newPassword">New Password</label>
      <input type="password" id="newPassword" placeholder="Enter new password" required>

      <label for="confirmPassword">Confirm Password</label>
      <input type="password" id="confirmPassword" placeholder="Confirm new password" required>

      <button type="submit">Save New Password</button>
      <div id="resetMessage" class="login-message" aria-live="polite"></div>
    </form>

    <p>Remembered your password? <a href="../Log-in_Page/login.html">Back to Login</a></p>
  </main>

  <footer>&copy; 2026 FarmLife. All rights reserved.</footer>
</body>
</html>
